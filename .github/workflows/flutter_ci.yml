name: Flutter CI

on: [push]

defaults:
  run:
    working-directory: taskle-app

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend integration tests
        working-directory: TaskleBackend/TaskleBackend.IntegrationTests
        run: dotnet test --configuration Release

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Start API (Docker)
        working-directory: TaskleBackend
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:5062/openapi/v1.json && exit 0
            sleep 2
          done
          echo "API not ready" >&2
          exit 1

      - name: Run E2E tests (Linux)
        run: flutter test integration_test -d linux

      - name: Stop API
        if: always()
        working-directory: TaskleBackend
        run: docker compose down
